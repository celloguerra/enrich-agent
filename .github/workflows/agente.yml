name: Agente de Enriquecimento de Produtos

on:
  # Botão "Run workflow" para disparar manualmente, com parâmetros opcionais.
  workflow_dispatch:
    inputs:
      max_minutos:
        description: 'Orçamento de tempo desta execução (minutos)'
        required: false
        default: '330'
      workers:
        description: 'Produtos processados em paralelo'
        required: false
        default: '6'
      partes:
        description: 'Partes a processar (vazio = todas). Ex.: parte_1,parte_2'
        required: false
        default: ''
      limite:
        description: 'Máx. de produtos por parte (0 = todos). Útil para testar.'
        required: false
        default: '0'

  # Roda todo dia às 6h de Brasília (9h UTC). Com a busca no DuckDuckGo
  # (gratuita), cada execução diária avança o reprocessamento das lacunas —
  # preenchendo apenas campos "Não encontrado"/vazios, sem reescrever o que
  # já está bom. Disparo manual continua disponível.
  schedule:
    - cron: '0 9 * * *'

# Impede duas execuções simultâneas: elas escreveriam no mesmo estado e
# entrariam em conflito no commit de volta.
concurrency:
  group: enriquecimento-produtos
  cancel-in-progress: false

# Necessário para o passo que devolve o progresso ao repositório.
permissions:
  contents: write

jobs:
  executar-agente:
    runs-on: ubuntu-latest
    # Um pouco acima do orçamento do agente (330 min), para sobrar tempo de
    # commit e upload de artefatos.
    timeout-minutes: 360

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          # Histórico completo: necessário para o git pull --rebase do passo
          # que devolve o progresso ao repositório.
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Garante que as partes existam mesmo que não tenham sido commitadas.
      - name: Gerar partes do CSV
        run: python breaker.py --chunk-size 1000

      - name: Executar agente
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MAX_MINUTOS: ${{ inputs.max_minutos || '330' }}
          WORKERS: ${{ inputs.workers || '6' }}
          PARTES: ${{ inputs.partes || '' }}
          LIMITE: ${{ inputs.limite || '0' }}
        run: python agent.py

      - name: Publicar resumo no sumário do job
        if: always()
        run: |
          echo '## Progresso do enriquecimento' >> "$GITHUB_STEP_SUMMARY"
          if [ -f saida/progresso.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat saida/progresso.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '_Nenhum progresso gravado._' >> "$GITHUB_STEP_SUMMARY"
          fi

      # Devolve estado + planilhas ao repositório para a próxima execução
      # retomar de onde parou. [skip ci] evita disparar um novo workflow.
      - name: Commitar progresso de volta ao repositório
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p saida
          git add saida parte_*.csv
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar."
          else
            git commit -m "chore: progresso do enriquecimento [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Salvar planilhas como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: produtos-enriquecidos
          path: saida/
          if-no-files-found: warn
          retention-days: 30
